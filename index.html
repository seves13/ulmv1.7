    height: 45px;

    text-align: center;
    font-size: 16px;

  .destination { font-weight: bold; }
  .via { font-size: 13px; color: #aaa; margin-top: 3px; }

  .countdown { font-weight: bold; color: #ffffff; text-align: right; }

// Entfernt das Ziel automatisch aus der Via-Liste, falls es am Ende steht
function cleanVia(viaString, destString) {
    if (!viaString) return "";
    var stops = viaString.split(" – ");
    if (stops.length > 0 && stops[stops.length - 1].trim() === destString.trim()) {
        stops.pop();
    }
    return stops.join(" – ");
}

function updateMonitor() {
    var now = new Date();
    
    var hours = zeroPad(now.getHours());
    var minutes = zeroPad(now.getMinutes());
    var seconds = zeroPad(now.getSeconds());
    document.getElementById('clock').innerHTML = hours + ":" + minutes + ":" + seconds;
    
    var dayOfWeek = now.getDay();
    var currentTagGroup = "Mo-Fr";
    if (dayOfWeek === 6) {
        currentTagGroup = "Sa";
    } else if (dayOfWeek === 0) {
        currentTagGroup = "So";
    }
    
    var currentMinutesFromMidnight = (now.getHours() * 60) + now.getMinutes();
    
    var upcoming = [];
    for (var i = 0; i < timetable.length; i++) {
        var entry = timetable[i];
        
        if (entry.tage === currentTagGroup) {
            var parts = entry.time.split(":");
            var entryMinutes = (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
            
            if (entryMinutes >= currentMinutesFromMidnight) {
                var diff = entryMinutes - currentMinutesFromMidnight;
                
                var displayCountdown = "";
                var displayAbsolute = entry.time + " Uhr";

                // Anpassung: Bei über 30 Minuten die feste Uhrzeit als Hauptanzeige nutzen
                if (diff > 30) {
                    displayCountdown = entry.time + " Uhr";
                    displayAbsolute = ""; // Kein zweiter Text nötig
                } else if (diff === 0) {
                    displayCountdown = "sofort";
                } else {
                    displayCountdown = "in " + diff + " Min";
                }
                
                var cleanedVia = cleanVia(entry.via, entry.dest);

                upcoming.push({
                    line: entry.line,
                    dest: entry.dest,
                    via: cleanedVia,
                    displayTime: displayCountdown,
                    absoluteTime: displayAbsolute,
                    rawMinutes: entryMinutes
                });
            }
        }
    }
    
    upcoming.sort(function(a, b) {
        return a.rawMinutes - b.rawMinutes;
    });
    
    var nextDepartures = upcoming.slice(0, 6);
    var tbody = document.getElementById('departure-table');
    tbody.innerHTML = '';
    
    if (nextDepartures.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="no-data">Keine weiteren Abfahrten heute.</td></tr>';
    } else {
        for (var j = 0; j < nextDepartures.length; j++) {
            var dep = nextDepartures[j];
            var viaHtml = dep.via ? '<div class="via">über ' + dep.via + '</div>' : '';
            var absoluteHtml = dep.absoluteTime ? '<div class="time-absolute">' + dep.absoluteTime + '</div>' : '';
            
            var row = '<tr>' +
                '<td><span class="line-badge">' + dep.line + '</span></td>' +
                '<td><div class="destination">' + dep.dest + '</div>' + viaHtml + '</td>' +
                '<td><div class="countdown">' + dep.displayTime + '</div>' + absoluteHtml + '</td>' +
                '</tr>';
            tbody.innerHTML += row;
        }
    }
}

updateMonitor();
setInterval(updateMonitor, 1000);
</script>
